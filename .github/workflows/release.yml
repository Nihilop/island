# Build + publication d'une release à CHAQUE push d'un tag `v*` (ex. `git tag v0.5.0 && git push --tags`).
# tauri-action compile l'app, signe les artefacts (updater) et crée la release GitHub
# avec les installeurs + `latest.json` (consommé par l'auto-updater).
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write # créer la release + uploader les assets
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4   # lit la version dans package.json (champ "packageManager")

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clés de signature de l'updater (à ajouter dans les secrets du dépôt) :
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Magasin visé par cette build (variables du dépôt ; vides = magasin officiel) :
          # Settings › Secrets and variables › Actions › Variables. Cf. .env.example.
          ISLAND_STORE_URL: ${{ vars.ISLAND_STORE_URL }}
          ISLAND_STORE_KEYS: ${{ vars.ISLAND_STORE_KEYS }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Island ${{ github.ref_name }}"
          releaseBody: |
            ## Island ${{ github.ref_name }}

            An island for Windows — attached to the top of your screen, it hosts your tools
            (media, timer, clipboard, Bitwarden vault, launcher, notifications, …) and
            isolated, signed extensions.

            ### Install
            Download **`Island_*_x64-setup.exe`** (recommended) or the `.msi` below, and run it.

            ### Auto-update
            Installed versions update themselves automatically on the next launch.
          releaseDraft: false # publie directement (plus de draft caché)
          # Tag avec un tiret (v2.0.0-alpha.1, -beta…) = préversion : GitHub l'exclut de
          # « latest », donc l'auto-updater (releases/latest/download/latest.json) ne la
          # propose pas aux versions installées. Seul un tag final (v2.0.0) est diffusé.
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true # génère latest.json (signé) pour l'auto-updater
