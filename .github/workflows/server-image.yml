# Image Docker du serveur du magasin → GHCR (ghcr.io/<owner>/island-store), consommée par
# server/deploy/docker-compose.yml (Watchtower la tire tout seul s'il tourne sur l'hôte).
#
#   push sur main touchant server/** ou crates/**  → :latest, :main
#   tag store-v1.2.3                               → :1.2.3, :1.2, :latest
#   lancement manuel (Actions › Run workflow)      → :<branche>
#
# Sans lien avec la release de l'app (tags v*).
name: Server image

on:
  push:
    branches: [main]
    paths: ["server/**", "crates/**", ".github/workflows/server-image.yml"]
    tags: ["store-v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase owner)
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/island-store" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=match,pattern=store-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=store-v(\d+\.\d+),group=1
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/store-v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
