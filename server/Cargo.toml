[package]
name = "island-store"
version = "0.1.0"
edition = "2021"
description = "Serveur du magasin d'Island (scènes de fonds animés, extensions)."
publish = false

[dependencies]
island-formats = { path = "../crates/island-formats" }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace", "limit", "fs"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
getrandom = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] } # API GitHub
rusty-s3 = "0.10"
url = "2" # R2 (API S3) : URL signées, sans dépendance réseau propre
hmac = "0.12" # cookie de session signé (panneau d'administration)
dotenvy = "0.15" # .env local (développement), jamais commité
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
resvg = { version = "0.45", default-features = false } # icône SVG des extensions → vignette (sans polices, images ni réseau)

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
