[package]
name = "island"
version = "2.8.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2" # notifications système (code de connexion au magasin)
island-formats = { path = "../crates/island-formats" } # formats partagés avec le serveur du magasin (scènes, .islandscene, .island)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = "0.32"
rustfft = "6" # FFT de l'égaliseur (niveaux par bande)
hmac = "0.12" # TOTP du coffre (RFC 6238)
sha1 = "0.10"
sha2 = "0.10" # TOTP + vérif SHA-256 du CLI Bitwarden téléchargé
ed25519-dalek = "2" # extensions v2 : signature des paquets .island
aes-gcm = "0.10" # Windows Hello : scellement AES-256-GCM
x25519-dalek = { version = "2", features = ["static_secrets"] } # Windows Hello : scellement sans invite
getrandom = "0.2"
rqrr = "0.9" # décodage des QR 2FA collés dans le coffre
ureq = { version = "2", features = ["json"] } # HTTP natif côté hôte (Bitwarden CLI, météo, IA, Discord, réseau des extensions v2)
arboard = "3" # presse-papiers cross-platform (texte + image) exposé aux extensions
base64 = "0.22" # base64 (icônes d'apps, image du presse-papiers, flux PTY)
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] } # vignettes (presse-papiers, étagère) # encodage/décodage PNG (icônes d'apps, image du presse-papiers)
wgpu = { version = "30", default-features = false, features = ["dx12", "wgsl", "std"] } # fonds animés : rendu natif (shaders WGSL partagés avec l'aperçu de l'éditeur)
pollster = "0.4" # fonds animés : init wgpu (futures bloquants sur le thread de rendu)
raw-window-handle = "0.6"
cosmic-text = "0.19.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"

# Capture d'écran (Windows Graphics Capture, anti-cheat safe).
[target.'cfg(windows)'.dependencies.windows-capture]
version = "1"

# Secrets chiffrés (`keyring`) — coffre natif par OS.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] } # Credential Manager
winreg = "0.52"
webview2-com = "0.38" # niveau mémoire WebView2 (notch fermé → « Low »)
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_Networking_WinInet",
  "Win32_Media_Audio",
  "Win32_Media_MediaFoundation", # vidéos des fonds animés (décodage matériel)
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Media_Audio_Endpoints",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "UI_Shell",
  "Win32_System_Performance",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_Registry",
  "Win32_System_Environment", # environnement frais des terminaux lancés par les extensions (CreateEnvironmentBlock)
  "Win32_System_Pipes",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_Time",
  "Win32_NetworkManagement_NetManagement",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Security_Credentials",
  "UI_Notifications",
  "Win32_System_Shutdown",
  "Win32_System_Diagnostics_ToolHelp",
  "UI_Notifications_Management",
  "ApplicationModel",
  "Security_Cryptography",
  # Capture (services/capture) : encodeur Media Foundation (MediaTranscoder), fenêtres DWM, DPI.
  "Media_Core",
  "Media_MediaProperties",
  "Media_Transcoding",
  "Storage",
  "Win32_Graphics_Dwm",
  "Win32_UI_HiDpi",
  # Activité (services/activity) : hook de premier plan (SetWinEventHook).
  "Win32_UI_Accessibility",
  # Automatisations (services/system_ctl) : nom des sorties audio (PKEY + PROPVARIANT).
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }

# Secrets : Keychain (macOS) / Secret Service (Linux). Permet au crate de compiler
# hors Windows ; le reste des services natifs reste à porter (cf. docs/internal/multi-os.md).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }


[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] } # test : le shader des fonds animés est valide
