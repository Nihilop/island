[package]
name = "island-formats"
version = "0.1.0"
edition = "2021"
description = "Formats d'Island partagés par l'app et le serveur du magasin : scènes de fonds animés, fichiers .islandscene, paquets d'extension .island."
publish = false

# Mêmes versions que src-tauri : une seule copie de chaque crate dans l'app.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
